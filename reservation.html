<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation - Buddies Restaurant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="main-header">
        <h1>Buddies Restaurant</h1>
        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="menu.html">Menu</a>
            <a href="gallery.html">Gallery</a>
            <a href="reservation.html">Reservation</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Book a Table</h2>
        <p>Please fill out the form below to reserve your table.</p>
        <img src="images/table.jpg" alt="Reserved Table" width="300">
        <form id="contact-form" action="#" method="post">
            <label for="name">Your Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

            <label for="email">Your Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

            <label for="table-zone">Choose Table Zone:</label><br>
            <select id="table-zone" name="zone">
                <option value="main">Main Hall</option>
                <option value="terrace">Terrace</option>
                <option value="vip">VIP Room</option>
            </select><br><br>

            <label for="comments">Special Requests:</label><br>
            <textarea id="comments" name="comments" rows="4" cols="40" placeholder="Any allergies or preferences?"></textarea><br><br>

            <button type="submit">Submit Reservation</button>
        </form>
    </main>

    <footer>
        <p>Team Buddies: Tomiris, Merey, Yenlik</p>
    </footer>

</body>
</html>
